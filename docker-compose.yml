services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: perch
      POSTGRES_PASSWORD: perch
      POSTGRES_DB: perch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U perch -d perch']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
